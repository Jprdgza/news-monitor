<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a37"/>
      <stop offset="1" stop-color="#12141b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b5e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 rounded square centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- the lead headline, the stories under it, and the signal -->
  <rect x="268" y="358" width="400" height="84" rx="42" fill="#f4f4f7"/>
  <rect x="268" y="514" width="488" height="44" rx="22" fill="#f4f4f7" fill-opacity="0.5"/>
  <rect x="268" y="622" width="340" height="44" rx="22" fill="#f4f4f7" fill-opacity="0.3"/>
  <circle cx="742" cy="400" r="104" fill="url(#glow)"/>
  <circle cx="742" cy="400" r="46" fill="#ff6b5e"/>
</svg>
