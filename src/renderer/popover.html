<!doctype html>
<html lang="en" class="popover">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>News Monitor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="popover.css" />
  </head>
  <body>
    <div class="pop">
      <header class="pop-head">
        <div>
          <h1>News Monitor</h1>
          <span id="pop-status" class="sub"></span>
        </div>
        <button id="pop-run" class="icon-btn" title="Check front pages now"></button>
      </header>
      <div id="pop-body" class="pop-body"></div>
      <footer class="pop-foot">
        <button id="pop-open" class="btn primary">Open News Monitor</button>
        <button id="pop-seen" class="btn" hidden>Mark alerts read</button>
      </footer>
    </div>
    <script src="common.js"></script>
    <script src="popover.js"></script>
  </body>
</html>
